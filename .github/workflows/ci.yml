name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q jq uuid-runtime
      - name: test-deps
        run: bash tests/test-deps.sh
      - name: spend-test
        run: bash tests/spend-test.sh
      - name: reflect-test
        run: bash tests/reflect-test.sh
      - name: assumptions-test
        run: bash tests/assumptions-test.sh
